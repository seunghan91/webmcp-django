[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmcp-django"
version = "0.2.2"
description = "Server-side WebMCP toolkit for Django: tool registry, script-safe manifests, shared browser runtime, CSRF and Origin-Trial template tags."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "seunghan Kim", email = "theqwe2000@gmail.com" },
]
keywords = ["webmcp", "django", "ai-agents", "browser-agents", "model-context-protocol", "document.modelContext", "origin-trial", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=4.2,<6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/seunghan91/webmcp-django"
Repository = "https://github.com/seunghan91/webmcp-django"
Changelog = "https://github.com/seunghan91/webmcp-django/blob/main/CHANGELOG.md"
Issues = "https://github.com/seunghan91/webmcp-django/issues"

[tool.hatch.build.targets.wheel]
packages = ["webmcp_django"]

# Hatch includes package data in both artifacts; keep the runtime explicit.
[tool.hatch.build.targets.wheel.force-include]
"webmcp_django/static/webmcp_django/webmcp-runtime.js" = "webmcp_django/static/webmcp_django/webmcp-runtime.js"

[tool.hatch.build.targets.sdist]
include = ["webmcp_django", "tests", "conformance", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]
